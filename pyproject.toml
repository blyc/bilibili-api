[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "bilibili-api-python"
authors = [{ name = "blyc"}]
maintainers = [{ name = "MoyuScript" }, { name = "Nemo2011" }]
version = "17.4.3"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
description = "The fork of module bilibili-api. 哔哩哔哩的各种 API 调用便捷整合（视频、动态、直播等），另外附加一些常用的功能。"
requires-python = ">=3.12"
keywords = ["bilibili", "api", "spider"]
classifiers = [
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
scripts = { "ivitools" = "bilibili_api.tools.ivitools.__main__:main" }
dependencies = [
    "beautifulsoup4>=4.9,<5",
    "colorama>=0.4.6,<1",
    "lxml>=5.0",
    "pyyaml>=6.0.1,<7",
    "brotli>=1.1",
    "qrcode>=7.4,<9",
    "APScheduler>=3.10,<4",
    "pillow>=10.1",
    "yarl>=1.9.2",
    "pycryptodomex>=3.19",
    "qrcode_terminal>=0.8",
    "PyJWT>=2,<3",
]

[dependency-groups]
dev = [
    "pylint",
    "mypy",
    "curl_cffi>=0.16",
]

[tool.uv.build-backend]
module-root = ""
module-name = "bilibili_api"

[project.entry-points.pyinstaller40]
"hook-dirs" = "bilibili_api._pyinstaller.entry_points:get_hook_dirs"
