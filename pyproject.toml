[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "bilibili-api-python"
authors = [{ name = "blyc"}]
maintainers = [{ name = "MoyuScript" }, { name = "Nemo2011" }]
version = "17.4.2"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
description = "The fork of module bilibili-api. 哔哩哔哩的各种 API 调用便捷整合（视频、动态、直播等），另外附加一些常用的功能。"
requires-python = ">=3.12"
keywords = ["bilibili", "api", "spider"]
classifiers = [
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
scripts = { "ivitools" = "bilibili_api.tools.ivitools.__main__:main" }
dependencies = [
    "beautifulsoup4",
    "colorama",
    "lxml",
    "pyyaml",
    "brotli",
    "qrcode",
    "APScheduler",
    "pillow",
    "yarl",
    "pycryptodomex",
    "qrcode_terminal",
    "PyJWT",
]

[dependency-groups]
dev = [
    "pylint",
    "mypy",
    "curl_cffi>=0.8.1b9",
]

[tool.uv.build-backend]
module-root = ""
module-name = "bilibili_api"

[project.entry-points.pyinstaller40]
"hook-dirs" = "bilibili_api._pyinstaller.entry_points:get_hook_dirs"
